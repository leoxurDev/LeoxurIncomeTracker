version: '3.8'

services:
  web:
    build: .
    container_name: leoxur_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - USE_MYSQL=${USE_MYSQL:-True}
      - DB_NAME=${DB_NAME:-income_tracker}
      - DB_USER=${DB_USER:-leoxur_admin}
      - DB_PASSWORD=${DB_PASSWORD:-securepassword123}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
    volumes:
      - web-static:/app/staticfiles
      - ./logs:/app/logs
      - sqlite-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  db:
    image: mysql:8.0
    container_name: leoxur_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=${DB_NAME:-income_tracker}
      - MYSQL_USER=${DB_USER:-leoxur_admin}
      - MYSQL_PASSWORD=${DB_PASSWORD:-securepassword123}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpass123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  nginx:
    image: nginx:alpine
    container_name: leoxur_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot-etc:/etc/letsencrypt:ro
      - ./certbot-var:/var/lib/letsencrypt:ro
      - ./webroot:/var/www/certbot:ro
      - web-static:/app/staticfiles:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: leoxur_certbot
    restart: unless-stopped
    # Checks every 12 hours and renews certificates if nearing expiration
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    volumes:
      - ./certbot-etc:/etc/letsencrypt
      - ./certbot-var:/var/lib/letsencrypt
      - ./webroot:/var/www/certbot

volumes:
  mysql-data:
  web-static:
  sqlite-data:
