apiVersion: v1
kind: ConfigMap
metadata:
  name: leoxur-config
  namespace: leoxur
  labels:
    app.kubernetes.io/name: leoxur-income-tracker
data:
  USE_MYSQL: "True"
  DB_NAME: "income_tracker"
  DB_HOST: "leoxur-mysql"
  DB_PORT: "3306"
  DB_USER: "leoxur_admin"
  ALLOWED_HOSTS: "*"
  DEBUG: "False"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  IMAP_HOST: "imap.gmail.com"
  IMAP_PORT: "993"
  DEFAULT_CURRENCY: "₹"
  GUNICORN_WORKERS: "3"
