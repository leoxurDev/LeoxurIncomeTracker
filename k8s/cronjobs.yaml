apiVersion: batch/v1
kind: CronJob
metadata:
  name: leoxur-fetch-emails
  namespace: leoxur
spec:
  # Poll IMAP inbox every 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: fetch-emails
              image: ghcr.io/leoxurdev/leoxur-income-tracker:latest
              imagePullPolicy: IfNotPresent
              command: ["python3", "manage.py", "fetch_emails"]
              envFrom:
                - configMapRef:
                    name: leoxur-config
                - secretRef:
                    name: leoxur-secrets
