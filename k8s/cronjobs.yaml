apiVersion: batch/v1
kind: CronJob
metadata:
  name: leoxur-daily-report
  namespace: leoxur
spec:
  # Run daily at 08:00 AM UTC
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: daily-report
              image: ghcr.io/leoxurdev/leoxur-income-tracker:latest
              imagePullPolicy: IfNotPresent
              command: ["python3", "manage.py", "send_daily_report"]
              envFrom:
                - configMapRef:
                    name: leoxur-config
                - secretRef:
                    name: leoxur-secrets
---
