apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: leoxur-hpa
  namespace: leoxur
  labels:
    app: leoxur-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: leoxur-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
